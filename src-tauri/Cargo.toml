[package]
name = "spec0-studio"
version = "0.3.0"
description = "spec0 Studio — spec-native API client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "spec0_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest directly rather than tauri-plugin-http: the plugin attaches the
# webview's Origin to every request, which makes CORS-configured servers reject
# a desktop client. See src/http.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset", "http2", "cookies", "multipart"] }
cookie_store = "0.22"
url = "2"
base64 = "0.23.1"
tauri-plugin-updater = "2"
# `spec0://` links. Handled in Rust (src/deep_link.rs) and handed to the web view
# through one narrow command, so the web view gets no deep-link permission.
tauri-plugin-deep-link = "2"

# On Windows and Linux a link starts a second copy of the app; this forwards the
# link to the copy already running instead. macOS delivers links to the running
# app itself, so it isn't needed there.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Secret environment values go to the OS credential store (see src/secrets.rs).
# `keyring` needs one native backend per platform, so the features are gated by
# target: a Linux build must not try to link the macOS Security framework.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# Secret Service over D-Bus. `vendored` builds libdbus from source so the build
# doesn't need libdbus-1-dev installed; `crypto-rust` avoids OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
