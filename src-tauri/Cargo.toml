[package]
name = "spec0-studio"
version = "0.1.0"
description = "spec0 Studio — spec-native API client"
edition = "2021"
rust-version = "1.77"

[lib]
name = "spec0_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest directly rather than tauri-plugin-http: the plugin attaches the
# webview's Origin to every request, which makes CORS-configured servers reject
# a desktop client. See src/http.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset", "http2", "cookies", "multipart"] }
cookie_store = "0.22"
url = "2"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
