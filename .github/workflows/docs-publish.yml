# Publishes the docs site to GitHub Pages (https://spec-0.github.io/studio).
#
# It runs when the Release workflow has published a release, and builds the
# docs from that release's tag, so the site always describes the app people
# can download. A change that only fixes the docs can be published without a
# release: run this workflow by hand, optionally with a ref (a tag, branch or
# commit; the latest release tag if left empty).
#
# GitHub Pages must be set to deploy from GitHub Actions
# (Settings → Pages → Build and deployment → Source: GitHub Actions).

name: Publish docs

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to publish (empty for the latest release)
        required: false
        default: ""

# One deployment at a time; a newer one waits rather than cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only after a successful release from a tag, not after a manual trial run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Choose what to publish
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF="$RELEASE_TAG"
          elif [ -n "$INPUT_REF" ]; then
            REF="$INPUT_REF"
          else
            REF=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "Publishing the docs from $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check the user guide
        run: node scripts/check-user-docs.mjs
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
