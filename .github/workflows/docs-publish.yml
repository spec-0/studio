# Publishes the docs site to GitHub Pages, at https://studio-docs.spec0.io.
#
# The custom domain is set in the repository's Pages settings; publishing from
# Actions needs no CNAME file.
#
# The Release workflow calls this after it has published a release, so the
# site is built from that release's tag and always describes the app people
# can download. A change that only fixes the docs can be published without a
# release: run this workflow by hand and pick the branch or tag to build in
# "Use workflow from".
#
# GitHub Pages must be set to deploy from GitHub Actions
# (Settings → Pages → Build and deployment → Source: GitHub Actions), with
# studio-docs.spec0.io as its custom domain.

name: Publish docs

on:
  workflow_call:
  workflow_dispatch:

# One deployment at a time; a newer one waits rather than cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Builds the commit the workflow runs on: the release tag when the
      # Release workflow calls it, or the branch or tag picked for a manual run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check the user guide
        run: node scripts/check-user-docs.mjs
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
