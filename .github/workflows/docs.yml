# Checks the user guide in docs/user before the site in site/ builds it: bad
# frontmatter, components the site doesn't have, links between pages that
# lead nowhere, and missing images. It runs in seconds, without building the
# site; docs-site.yml builds it.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/user/**"
      - "scripts/check-user-docs.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/user/**"
      - "scripts/check-user-docs.mjs"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check the user guide
        run: node scripts/check-user-docs.mjs
