# Type-check, test and build on every push and pull request.
#
# `release.yml` only runs on a tag, so without this the tests would first run
# during a release, after the change had already been merged.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs neither a browser nor a Rust toolchain.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      # Vitest transpiles without type-checking, so a test can compile in the
      # runner and still be wrong. The step above is what catches that, and it
      # runs first on purpose.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The check the unit suite structurally cannot perform.
  #
  # Vitest runs in Node, which has no content security policy, so a dependency
  # that needs `eval` passes every test and fails in the shipped app. That is
  # precisely how validation stayed broken through a release. This runs the
  # built bundle in a real browser under the real policy.
  csp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - run: npm ci

      - name: Run the app under its content security policy
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:csp

  # The Rust shell has had tests since the first release and none of them had
  # ever run in CI. Studio now ships for macOS, Linux and Windows, and the
  # shell has platform-specific code (menus, git discovery, the Windows console
  # flag), so the tests run on all three rather than on one and hoping.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's documented Linux build packages. macOS and Windows need none.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Tests only. `cargo fmt --check` and `clippy -D warnings` both fail on the
      # existing code, and reformatting the shell to satisfy a linter does not
      # belong in a change about tests — it would bury the thing under review.
      # Worth adopting on its own, deliberately.
      - name: Test
        working-directory: src-tauri
        run: cargo test
