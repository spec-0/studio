# Build, sign, notarize and publish a spec0 Studio release.
#
# Trigger: push a tag `vX.Y.Z` matching the version in src-tauri/tauri.conf.json,
# or dispatch manually to produce an unpublished draft.
#
# Required repository secrets (see docs/RELEASING.md for how to produce each):
#   MACOS_CERTIFICATE       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD   password set when exporting that .p12
#   KEYCHAIN_PASSWORD       any string; secures the throwaway build keychain
#   APPLE_API_KEY_P8        contents of the App Store Connect .p8 private key
#   APPLE_API_KEY_ID        the key id, e.g. ABCD123456
#   APPLE_API_ISSUER        the issuer UUID
#
# Notes learned the hard way, do not remove:
#   * `security set-key-partition-list` is REQUIRED. Without it codesign blocks
#     on a GUI keychain prompt that no runner can answer, and the job hangs until
#     it times out rather than failing fast.
#   * Notarization is submitted with the notarytool bundled in Xcode. Runners
#     have Xcode selected by default, so this is automatic — but if you ever add
#     an `xcode-select` step pointing at the Command Line Tools, don't. That
#     build of notarytool reports its version as `unknown (0)` and submissions
#     made with it were never processed.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A tag that disagrees with the manifest ships a version nobody chose, and
      # a published release is awkward to retract. Fail before anything is built.
      - name: Tag and manifest must agree
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref_name }}
        run: |
          TAG="${REF#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "$CONF" || "$TAG" != "$PKG" ]]; then
            echo "::error::Tag $REF implies $TAG but tauri.conf.json says $CONF and package.json says $PKG."
            exit 1
          fi
          echo "Releasing $TAG"

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, build
        run: |
          npm run type-check
          npm test
          npm run build

      # Import the Developer ID certificate into a throwaway keychain that exists
      # only for this job, rather than touching the runner's default keychain.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI prompt forever. See header.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          rm -f $RUNNER_TEMP/cert.p12
          echo "Imported:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p $RUNNER_TEMP/private_keys
          printf '%s' "$APPLE_API_KEY_P8" > $RUNNER_TEMP/private_keys/AuthKey.p8
          chmod 600 $RUNNER_TEMP/private_keys/AuthKey.p8

      # Tauri signs, submits to the notary service, waits, and staples the ticket
      # into the .app before building the .dmg from it — so the app a user drags
      # out of the disk image carries its own ticket and launches offline.
      - name: Build, sign, notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey.p8
          echo "notarytool in use: $(xcrun --find notarytool)"
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      # The .dmg is what people download, and it needs its own notarization —
      # a signed-but-unnotarized disk image still raises "Apple cannot check it
      # for malicious software" on the machine that fetched it. Tauri notarizes
      # and staples the .app; the image it then builds is signed only.
      - name: Notarize and staple the dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --key $RUNNER_TEMP/private_keys/AuthKey.p8 \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 45m
          xcrun stapler staple "$DMG"

      # Prove the artifacts are what we claim before anyone downloads them.
      # Gatekeeper is the only check that speaks for the end user's machine, and
      # `stapler validate` is what proves it will still pass with no network —
      # spctl alone can be satisfied by an online lookup and hides a missing
      # ticket.
      - name: Verify notarization and Gatekeeper
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          DMG=$(ls "$BUNDLE"/dmg/*.dmg)

          echo "── disk image ──"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

          echo "── the app inside it ──"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$MNT"
          APP="$MNT/spec0 Studio.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          hdiutil detach "$MNT" -quiet

      - name: Checksums
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          cd "$BUNDLE/dmg"
          shasum -a 256 *.dmg | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: spec0-studio-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          gh release create "${{ github.ref_name }}" \
            --title "spec0 Studio ${{ github.ref_name }}" \
            --generate-notes \
            "$BUNDLE"/dmg/*.dmg \
            "$BUNDLE"/dmg/SHA256SUMS.txt
