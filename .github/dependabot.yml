# Weekly pull requests for dependency updates. Minor and patch updates are
# grouped per ecosystem so they arrive as one PR each; major updates come
# separately because they usually need code changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node type definitions follow the Node version CI runs (24). Move them
      # together with the node-version in the workflows.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  # The docs site in site/ has its own dependencies.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # fumadocs-ui is installed under an npm alias (npm:@fumadocs/base-ui),
      # which Dependabot can't update, and it requires the exact same
      # fumadocs-core version. Update fumadocs-core, fumadocs-mdx and the alias
      # together by hand instead, or the site stops installing.
      - dependency-name: "fumadocs-core"
      - dependency-name: "fumadocs-mdx"
    groups:
      docs-site-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tauri-plugin-deep-link 2.6.2 doesn't compile on Linux against rust-ini
      # 0.21.3 (it builds ini::ParseOption with two of its four fields), and
      # single-instance 2.5.4 requires it. Take the next releases instead.
      - dependency-name: tauri-plugin-deep-link
        versions: ["2.6.2"]
      - dependency-name: tauri-plugin-single-instance
        versions: ["2.5.4"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
